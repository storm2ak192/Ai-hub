name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore and patch sources
        run: |
          curl -sL "https://raw.githubusercontent.com/storm2ak192/Ai-hub/c50019ac166993f2b3c1e36d43ec170481fb1d42/app/src/main/java/com/example/ui/screens/BrowserScreen.kt" -o app/src/main/java/com/example/ui/screens/BrowserScreen.kt
          curl -sL "https://raw.githubusercontent.com/storm2ak192/Ai-hub/c70ad478b52880ebfe2c8d850ed4949df5d31379/app/src/main/java/com/example/ui/AIHubApp.kt" -o app/src/main/java/com/example/ui/AIHubApp.kt
          python3 tools/patch_browser_screen.py
          python3 tools/patch_aihub_app.py
          python3 tools/fix_patched_browser.py
          python3 tools/patch_viewmodel_defaults.py
          python3 tools/patch_settings_reorder.py
          python3 tools/patch_custom_tabs.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Generate temporary keystore for Release
        run: |
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore my-upload-key.jks \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=AI Hub, OU=Mobile, O=AIHub, L=Cairo, ST=Cairo, C=EG"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "gradlew not found, using system gradle"
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
