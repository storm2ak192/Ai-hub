name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore BrowserScreen.kt (status bar fix)
        run: |
          if [ -f tools/BrowserScreen.kt.gz.b64 ]; then
            base64 -d tools/BrowserScreen.kt.gz.b64 | gunzip > app/src/main/java/com/example/ui/screens/BrowserScreen.kt
            echo "BrowserScreen.kt restored successfully"
            wc -l app/src/main/java/com/example/ui/screens/BrowserScreen.kt
          else
            echo "WARNING: restore file missing"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generate temporary keystore for Release
        run: |
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore my-upload-key.jks \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=AI Hub, OU=Mobile, O=AIHub, L=Cairo, ST=Cairo, C=EG"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "No gradlew found, using gradle directly..."
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
