name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore BrowserScreen.kt from last good commit + status bar fix
        run: |
          curl -sL "https://raw.githubusercontent.com/storm2ak192/Ai-hub/c50019ac166993f2b3c1e36d43ec170481fb1d42/app/src/main/java/com/example/ui/screens/BrowserScreen.kt" \
            -o app/src/main/java/com/example/ui/screens/BrowserScreen.kt

          python3 << 'PY'
          path = "app/src/main/java/com/example/ui/screens/BrowserScreen.kt"
          with open(path) as f:
              text = f.read()
          old = """// Main WebView Container: adapts dynamically to system navigation bar AND on-screen keyboard\n        Box(\n            modifier = Modifier\n                .weight(1f)\n                .fillMaxWidth()\n                .windowInsetsPadding(WindowInsets.navigationBars.union(WindowInsets.ime))\n        ) {"""
          new = """// Main WebView Container: always respect status bar (top) + navigation bar (bottom) + keyboard\n        // so content never goes under the notification bar, even in fullscreen mode\n        Box(\n            modifier = Modifier\n                .weight(1f)\n                .fillMaxWidth()\n                .windowInsetsPadding(\n                    WindowInsets.statusBars\n                        .union(WindowInsets.navigationBars)\n                        .union(WindowInsets.ime)\n                )\n        ) {"""
          if old in text:
              text = text.replace(old, new, 1)
              with open(path, "w") as f:
                  f.write(text)
              print("Status bar fix applied successfully")
          else:
              print("WARNING: pattern not found")
          print("Lines:", text.count(chr(10))+1)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generate temporary keystore for Release
        run: |
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore my-upload-key.jks \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=AI Hub, OU=Mobile, O=AIHub, L=Cairo, ST=Cairo, C=EG"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "No gradlew found, using gradle directly..."
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
