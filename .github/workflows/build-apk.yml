name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/custom-tabs-migration

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore and patch sources
        run: |
          python3 tools/patch_browser_screen.py
          python3 tools/patch_aihub_app.py
          python3 tools/fix_patched_browser.py
          python3 tools/patch_viewmodel_defaults.py
          python3 tools/patch_settings_arrows.py
          python3 tools/patch_pinned_shortcuts.py
          python3 tools/patch_app_strings_link_chooser.py
          python3 tools/patch_link_chooser.py

      - name: Verify requested source features before build
        run: |
          grep -q 'onAddToHomeScreen = { viewModel.pinSiteShortcut(it) }' app/src/main/java/com/example/ui/AIHubApp.kt
          grep -q 'fun openPinnedSite' app/src/main/java/com/example/ui/viewmodel/HubViewModel.kt
          grep -q 'ACTION_OPEN_PINNED_SITE' app/src/main/java/com/example/MainActivity.kt
          grep -q 'move_up_' app/src/main/java/com/example/ui/screens/SettingsScreen.kt
          grep -q 'move_down_' app/src/main/java/com/example/ui/screens/SettingsScreen.kt
          ! grep -Eq 'DragHandle|detectDragGesturesAfterLongPress|draggingIndex' app/src/main/java/com/example/ui/screens/SettingsScreen.kt
          grep -q 'var pendingLinkUrl' app/src/main/java/com/example/ui/screens/BrowserScreen.kt
          grep -q 'pendingLinkUrl' app/src/main/java/com/example/ui/screens/BrowserScreen.kt
          grep -q 'onOpenMatchedSite' app/src/main/java/com/example/ui/AIHubApp.kt
          grep -q 'SecureExternalLinkDialog' app/src/main/java/com/example/ui/AIHubApp.kt
          grep -q 'android:scheme="https"' app/src/main/AndroidManifest.xml
          grep -q 'androidx.browser' app/build.gradle.kts
          grep -q 'MutableStateFlow(BottomNavTab.HOME)' app/src/main/java/com/example/ui/viewmodel/HubViewModel.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Prepare persistent release signing key (or temporary first-build fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.AIHUB_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.AIHUB_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.AIHUB_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.AIHUB_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_ALIAS_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/aihub-release.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/aihub-release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Using the user's persistent release signing key."
          else
            keytool -genkeypair -alias upload -keyalg RSA -keysize 2048 -validity 10000 -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" -storepass android123 -keypass android123 -dname "CN=AI Hub, OU=Mobile, O=AIHub, L=Cairo, ST=Cairo, C=EG"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "::warning::Persistent signing secrets are not configured. This APK uses a temporary key and cannot update another differently-signed build."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "gradlew not found, using system gradle"
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
